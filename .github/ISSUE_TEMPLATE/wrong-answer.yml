name: Wrong quote or missing source
description: A skill misquoted a source, cited the wrong one, or the archive lacks a source it should have.
title: "[skill name]: "
labels: ["answer quality"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - google-leak
        - google-maps-ranking
        - google-patents
        - google-ai-patents
        - llm-patents
        - google-search-docs
        - google-staff-statements
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The question you asked
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What the answer got wrong, or which source is missing
      description: Paste the answer or the part that is wrong. Add a link to the source if you have one.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code, Codex, Cursor, Claude app with the MCP server…
